*{box-sizing:border-box;border-radius:0;box-shadow:none}
html,body{margin:0;height:100%;overflow:hidden}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--md-sys-color-background);color:var(--md-sys-color-on-background);font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100%}

.app-title{font-size:15px;font-weight:600;margin:0 8px 0 0;white-space:nowrap;letter-spacing:.01em}
.app-title small{display:block;font-weight:400;font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.hnav{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.header-end{display:flex;align-items:center;gap:2px}
.vsep{width:1px;height:28px;background:var(--md-sys-color-outline-variant);margin:0 6px;flex:none}
.hsep{height:1px;width:32px;background:var(--md-sys-color-outline-variant);margin:6px auto;flex:none}
.zoom-read{min-width:68px;white-space:nowrap;height:48px;border:0;background:transparent;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--md-sys-color-on-surface-variant)}
.save-state{font-size:12px;color:var(--md-sys-color-on-surface-variant);padding:0 8px;white-space:nowrap}
.save-state[data-s="saving"]{color:var(--md-sys-color-primary)}
.save-state[data-s="err"]{color:var(--md-sys-color-error)}

/* BUTTONS */
.icon-btn{width:48px;height:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--md-sys-color-on-surface-variant);cursor:pointer;padding:0;flex:none;position:relative}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface)}
.icon-btn[aria-pressed="true"]{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.icon-btn:disabled{opacity:.38;cursor:default;background:transparent}
.icon-btn .kbd{position:absolute;right:3px;bottom:2px;font-size:9px;line-height:1;opacity:.7;letter-spacing:0}
.btn{min-height:48px;padding:0 16px;border:1px solid var(--md-sys-color-outline);background:transparent;color:var(--md-sys-color-on-surface);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;letter-spacing:.08em;font-size:12px;white-space:nowrap}
.btn:hover{background:var(--md-sys-color-surface-container-high)}
.btn.primary{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);border-color:var(--md-sys-color-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--md-sys-color-error);border-color:var(--md-sys-color-error)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:48px;padding:0 12px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 auto}

/* WORKSPACE */
.workspace{display:grid;grid-template-columns:56px minmax(0,1fr) auto;min-height:0;position:relative}
.toolbox{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;background:var(--md-sys-color-surface-container-lowest);border-right:1px solid var(--md-sys-color-outline-variant);overflow-y:auto;scrollbar-width:thin}
.center{display:grid;grid-template-rows:auto auto 1fr;min-width:0;min-height:0}

/* SHEET TABS (caderno) */
.tabs{display:flex;align-items:stretch;background:var(--md-sys-color-surface-container-low);border-bottom:1px solid var(--md-sys-color-outline-variant);overflow-x:auto;scrollbar-width:thin;min-height:48px}
.sheet-tab{display:flex;align-items:center;gap:4px;min-height:48px;padding:0 6px 0 14px;border:0;border-right:1px solid var(--md-sys-color-outline-variant);background:transparent;cursor:pointer;color:var(--md-sys-color-on-surface-variant);white-space:nowrap;position:relative}
.sheet-tab[aria-selected="true"]{background:var(--md-sys-color-surface-container-lowest);color:var(--md-sys-color-on-surface);font-weight:600}
.sheet-tab[aria-selected="true"]::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--md-sys-color-primary)}
.sheet-tab .trace{font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--md-sys-color-tertiary-fixed);color:var(--md-sys-color-on-tertiary-fixed);padding:1px 5px;margin-left:4px}
.tab-add{border:0;background:transparent;min-width:48px;cursor:pointer;color:var(--md-sys-color-on-surface-variant)}
.tab-add:hover{background:var(--md-sys-color-surface-container-high)}

/* TOOL OPTIONS */
.optbar{display:flex;align-items:center;gap:8px;padding:0 8px;min-height:56px;background:var(--md-sys-color-surface-container-lowest);border-bottom:1px solid var(--md-sys-color-outline-variant);overflow-x:auto;scrollbar-width:thin}
.optbar .tname{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--md-sys-color-primary);white-space:nowrap;padding-right:4px}
.optbar .hint{font-size:12px;color:var(--md-sys-color-on-surface-variant);white-space:nowrap}
.optbar.block-mode{background:var(--md-sys-color-tertiary-fixed);color:var(--md-sys-color-on-tertiary-fixed)}
.optbar.block-mode .tname,.optbar.block-mode .hint{color:var(--md-sys-color-on-tertiary-fixed)}
.of{display:flex;align-items:center;gap:6px;white-space:nowrap}
.of label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--md-sys-color-on-surface-variant)}
.inp,.sel{min-height:48px;padding:0 12px;border:1px solid var(--md-sys-color-outline);background:var(--md-sys-color-surface-container-low);color:var(--md-sys-color-on-surface);min-width:0}
.inp.num{width:84px;font-variant-numeric:tabular-nums}
.optbar .inp,.optbar .sel{min-height:40px;height:40px}
.optbar .icon-btn,.optbar .btn{height:48px}
.seg{display:inline-flex;border:1px solid var(--md-sys-color-outline)}
.seg button{min-height:46px;min-width:48px;padding:0 10px;border:0;background:transparent;cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant)}
.seg button+button{border-left:1px solid var(--md-sys-color-outline-variant)}
.seg button[aria-pressed="true"]{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:48px;cursor:pointer;font-size:13px;white-space:nowrap}
.chk input{width:20px;height:20px;accent-color:var(--md-sys-color-primary);margin:0}

/* STAGE */
.stage{position:relative;overflow:hidden;background:var(--md-sys-color-surface-container);min-height:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;user-select:none}
#cv.tool-select{cursor:default}
#cv.panning{cursor:grabbing}
.paper{fill:#ffffff}
.lbl{cursor:pointer}
.lbl rect{fill:#ffffff;stroke:rgb(0 103 124);stroke-width:1}
.lbl text{fill:rgb(0 58 71);font:600 11px 'Hind',sans-serif}
.lbl:hover rect{fill:rgb(177 236 255)}
.empty-hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:#5d6466;pointer-events:none;max-width:340px}
.empty-hint strong{display:block;font-size:16px;color:#1b1b1b;margin-bottom:4px}

/* PET PALETTE (estilo ArchiCAD) */
.pet{position:absolute;z-index:20;display:none;align-items:center;background:var(--md-sys-color-surface-container-lowest);border:1px solid var(--md-sys-color-outline);padding:0}
.pet.show{display:flex}
.pet .icon-btn{width:44px;height:48px;min-width:44px}
.pet .ptitle{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant);padding:0 8px;writing-mode:vertical-rl;transform:rotate(180deg);border-right:1px solid var(--md-sys-color-outline-variant);align-self:stretch;display:flex;align-items:center;justify-content:center;cursor:move;touch-action:none;min-width:28px;user-select:none;background:var(--md-sys-color-surface-container)}
.usage-btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-align:left;min-width:180px;max-width:100%}
.usage-btn .ut{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usage-btn .sw{width:14px;height:14px;flex:none;border:1px solid rgba(0,0,0,.25)}
.optbar .usage-btn{min-height:40px;height:40px}
.wbtn{min-height:48px;padding:0 10px;letter-spacing:0;text-transform:none}
.wbtn[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.wbtn[aria-pressed=true]{background:var(--md-sys-color-surface-container-high)}
#menu-usage{width:300px;max-height:min(70vh,520px)}
#menu-usage [aria-selected=true]{background:var(--md-sys-color-primary-fixed);color:var(--md-sys-color-on-primary-fixed)}
.pet .pnum{width:64px;min-height:40px;height:40px;margin:0 4px;padding:0 6px}
.pet.docked{left:50% !important;top:auto !important;bottom:12px;transform:translateX(-50%)}
.edit-inp{position:absolute;z-index:25;width:84px;min-height:32px;height:32px;padding:0 6px;border:2px solid var(--md-sys-color-primary);background:#fff;color:#1b1b1b;font-weight:600;text-align:center}

/* STATUS BAR */
.statusbar>*{flex:none}.statusbar>.status-msg{flex:1 1 auto}.app-header>*{flex:none}.app-header>.hnav{flex:1 1 auto}
.statusbar{display:flex;align-items:center;gap:2px;min-height:48px;padding:0 8px;background:var(--md-sys-color-surface-container-lowest);border-top:1px solid var(--md-sys-color-outline-variant);overflow-x:auto;scrollbar-width:none}
.tog{min-height:48px;min-width:48px;padding:0 10px;border:0;background:transparent;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant);white-space:nowrap}
.tog[aria-pressed="true"]{color:var(--md-sys-color-primary);box-shadow:inset 0 -3px 0 var(--md-sys-color-primary)}
.tog:hover{background:var(--md-sys-color-surface-container-high)}
.coords{font-variant-numeric:tabular-nums;font-size:12px;color:var(--md-sys-color-on-surface-variant);padding:0 10px;white-space:nowrap;min-width:150px}
.typed-wrap{display:flex;align-items:center;gap:6px}
.typed-wrap label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant);white-space:nowrap}
#typed{width:110px;min-height:36px;height:36px}
.status-msg{flex:1;font-size:12px;color:var(--md-sys-color-on-surface-variant);padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:80px}
.footer-ver{font-size:11px;color:var(--md-sys-color-on-surface-variant);white-space:nowrap;padding:0 6px}

/* DOCK */
.dock{width:340px;display:flex;flex-direction:column;background:var(--md-sys-color-surface-container-lowest);border-left:1px solid var(--md-sys-color-outline-variant);min-height:0}
.dock[hidden]{display:none}
.dock-tabs{display:flex;border-bottom:1px solid var(--md-sys-color-outline-variant)}
.dock-tab{flex:1;min-height:48px;border:0;background:transparent;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant);display:flex;align-items:center;justify-content:center;gap:4px}
.dock-tab[aria-selected="true"]{color:var(--md-sys-color-primary);box-shadow:inset 0 -3px 0 var(--md-sys-color-primary)}
.dock-tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.dock-body{flex:1;overflow-y:auto;padding:16px;min-height:0}
.panel[hidden]{display:none}
.sec{border-top:1px solid var(--md-sys-color-outline-variant);padding:14px 0 6px}
.sec:first-child{border-top:0;padding-top:0}
.sec h3{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field>label{font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.field .inp,.field .sel{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:48px 1fr 72px;gap:8px;align-items:center}
input[type=color]{width:48px;height:48px;padding:3px;border:1px solid var(--md-sys-color-outline);background:var(--md-sys-color-surface-container-low);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--md-sys-color-primary);min-height:48px}
.readout{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;margin-bottom:8px}
.readout b{font-variant-numeric:tabular-nums;text-align:right}
.icon-grid{display:flex;flex-wrap:wrap;gap:2px}
.note{font-size:12px;color:var(--md-sys-color-on-surface-variant);margin:6px 0 10px}
.alert{padding:10px 12px;font-size:12px;margin:8px 0;border:1px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface-container-low)}
.alert.ok{color:var(--md-extended-color-custom-color1-on-color-container);background:var(--md-extended-color-custom-color1-color-container);border-color:transparent}
.alert.err{color:var(--md-sys-color-on-error-container);background:var(--md-sys-color-error-container);border-color:transparent}

/* LISTS */
.list{display:flex;flex-direction:column;border:1px solid var(--md-sys-color-outline-variant)}
.li{display:flex;align-items:center;gap:2px;border-top:1px solid var(--md-sys-color-outline-variant);min-height:48px}
.li:first-child{border-top:0}
.li.active{background:var(--md-sys-color-primary-fixed);color:var(--md-sys-color-on-primary-fixed)}
.dark .li.active{background:var(--md-sys-color-on-primary-fixed-variant);color:var(--md-sys-color-primary-fixed)}
.li .main{flex:1;min-width:0;min-height:48px;border:0;background:transparent;text-align:left;cursor:pointer;padding:4px 10px;color:inherit}
.li .main span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .main small{display:block;font-size:11px;opacity:.75}
.li .icon-btn{color:inherit}
.tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border:1px solid currentColor;margin-right:4px;opacity:.85}
.thumb{width:56px;height:48px;flex:none;background:#fff;border:1px solid var(--md-sys-color-outline-variant);margin-left:6px}
.furn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.furn{border:1px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface-container-lowest);cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;color:var(--md-sys-color-on-surface);font-size:11px;text-align:center}
.furn:hover{border-color:var(--md-sys-color-primary)}
.furn svg{width:72px;height:56px;background:#fff}

/* TABLES */
table.at{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.at caption{text-align:left;font-weight:600;padding:6px 0;font-size:13px}
.at th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:left;color:var(--md-sys-color-on-surface-variant);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--md-sys-color-outline)}
.at td{padding:6px 4px;border-bottom:1px solid var(--md-sys-color-outline-variant);font-variant-numeric:tabular-nums}
.at td.n,.at th.n{text-align:right}
.at tr.tot td{font-weight:700;border-bottom:2px solid var(--md-sys-color-outline)}
.at .sw{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
details.typ{border:1px solid var(--md-sys-color-outline-variant);margin-bottom:8px}
details.typ summary{min-height:48px;display:flex;align-items:center;padding:0 10px;cursor:pointer;font-weight:600;gap:8px}
details.typ>div{padding:0 10px 6px}

/* MENU / DIALOG */
.menu{position:fixed;z-index:40;max-height:calc(100vh - 16px);overflow-y:auto;background:var(--md-sys-color-surface-container-lowest);border:1px solid var(--md-sys-color-outline);min-width:280px;display:none;flex-direction:column;padding:4px 0}
.menu.show{display:flex}
.menu button{min-height:48px;border:0;background:transparent;text-align:left;padding:0 16px;cursor:pointer;display:flex;align-items:center;gap:12px;color:var(--md-sys-color-on-surface)}
.menu button:hover{background:var(--md-sys-color-surface-container-high)}
.menu button:disabled{opacity:.4;cursor:default}
.menu button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.menu .mh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant);padding:8px 16px 4px}
.menu hr{border:0;border-top:1px solid var(--md-sys-color-outline-variant);margin:4px 0;width:100%}
dialog{border:1px solid var(--md-sys-color-outline);background:var(--md-sys-color-surface-container-lowest);color:var(--md-sys-color-on-surface);padding:20px;min-width:320px;max-width:min(92vw,460px)}
dialog::backdrop{background:rgb(0 0 0 / .35)}
dialog h2{margin:0 0 12px;font-size:16px;font-weight:600}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--md-sys-color-inverse-surface);color:var(--md-sys-color-inverse-on-surface);padding:12px 18px;font-size:13px;z-index:60;display:none;max-width:90vw}
.toast.show{display:block}

@media (max-width:900px){
 .app-title{display:none}
 .dock{position:absolute;right:0;top:0;bottom:0;z-index:30;width:min(340px,92vw)}
 .app-title small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="app-header">
  <div class="logo-container">
    <a href="#" id="home-link" aria-label="Ir para a página inicial"><img class="brand-logo" alt="Königsberger Vannucchi Arquitetos Associados"></a>
  </div>
  <h1 class="app-title">KV Manchas<small>Plantas de manchas de áreas</small></h1>
  <nav class="hnav" aria-label="Comandos">
    <button class="icon-btn" id="cmd-undo" aria-label="Desfazer (Ctrl+Z)" title="Desfazer (Ctrl+Z)"><span data-icon="undo"></span></button>
    <button class="icon-btn" id="cmd-redo" aria-label="Refazer (Ctrl+Y)" title="Refazer (Ctrl+Y)"><span data-icon="redo"></span></button>
    <span class="vsep" aria-hidden="true"></span>
    <button class="icon-btn" id="cmd-zoom-out" aria-label="Reduzir zoom" title="Reduzir zoom (-)"><span data-icon="zoomOut"></span></button>
    <button class="zoom-read" id="cmd-zoom-read" aria-label="Escala da vista. Clique para ajustar à tela" title="Ajustar à tela (Home)">100%</button>
    <button class="icon-btn" id="cmd-zoom-in" aria-label="Ampliar zoom" title="Ampliar zoom (+)"><span data-icon="zoomIn"></span></button>
    <button class="icon-btn" id="cmd-fit" aria-label="Ajustar desenho à tela" title="Ajustar à tela (Home)"><span data-icon="fit"></span></button>
  </nav>
  <div class="header-end">
    <span class="save-state" id="save-state" role="status" aria-live="polite"></span>
    <button class="icon-btn" id="cmd-giraffe" aria-label="Giraffe: importar e enviar" aria-haspopup="menu" aria-expanded="false" title="Giraffe — copiar do mapa / enviar ao mapa"><span data-icon="map"></span></button>
    <button class="icon-btn" id="cmd-file" aria-label="Arquivo: exportar e importar" aria-haspopup="menu" aria-expanded="false" title="Arquivo"><span data-icon="file"></span></button>
    <button class="icon-btn" id="cmd-theme" aria-label="Tema: automático" title="Tema"><span data-icon="contrast"></span></button>
    <button class="icon-btn" id="cmd-dock" aria-label="Painéis" aria-expanded="true" aria-controls="dock" title="Painéis"><span data-icon="panelRight"></span></button>
  </div>
</header>

<main class="workspace" id="workspace">
  <nav class="toolbox" role="toolbar" aria-label="Ferramentas" aria-orientation="vertical" id="toolbox">
    <button class="icon-btn tool" data-tool="select" aria-label="Selecionar (V)" title="Selecionar (V) — clique no vértice/aresta abre o menu de edição" aria-pressed="true"><span data-icon="pointer"></span><span class="kbd">V</span></button>
    <button class="icon-btn tool" data-tool="pan" aria-label="Mover vista (H ou Espaço)" title="Mover vista (H / Espaço / botão do meio)" aria-pressed="false"><span data-icon="hand"></span><span class="kbd">H</span></button>
    <span class="hsep" aria-hidden="true"></span>
    <button class="icon-btn tool" data-tool="rect" aria-label="Retângulo (R)" title="Retângulo / quadrado (R) — digite 4x3 + Enter" aria-pressed="false"><span data-icon="rect"></span><span class="kbd">R</span></button>
    <button class="icon-btn tool" data-tool="poly" aria-label="Polígono (P)" title="Polígono (P) — Enter ou clique no 1º ponto fecha" aria-pressed="false"><span data-icon="poly"></span><span class="kbd">P</span></button>
    <button class="icon-btn tool" data-tool="line" aria-label="Linha poligonal (L)" title="Linha / poligonal (L) — Enter conclui" aria-pressed="false"><span data-icon="line"></span><span class="kbd">L</span></button>
    <button class="icon-btn tool" data-tool="curve" aria-label="Curva suave (S)" title="Curva suave por pontos (S) — Enter conclui" aria-pressed="false"><span data-icon="curve"></span><span class="kbd">S</span></button>
    <button class="icon-btn tool" data-tool="arc" aria-label="Arco por 3 pontos (A)" title="Arco por 3 pontos (A)" aria-pressed="false"><span data-icon="arc"></span><span class="kbd">A</span></button>
    <button class="icon-btn tool" data-tool="circle" aria-label="Círculo (C)" title="Círculo (C) — centro e raio" aria-pressed="false"><span data-icon="circle"></span><span class="kbd">C</span></button>
    <span class="hsep" aria-hidden="true"></span>
    <button class="icon-btn tool" data-tool="measure" aria-label="Medir (Q)" title="Medir distâncias (Q)" aria-pressed="false"><span data-icon="ruler"></span><span class="kbd">Q</span></button>
    <button class="icon-btn tool" data-tool="dim" aria-label="Cota linear (D)" title="Cota linear (D)" aria-pressed="false"><span data-icon="dim"></span><span class="kbd">D</span></button>
    <button class="icon-btn tool" data-tool="guide" aria-label="Linha guia (G)" title="Linha guia de construção (G)" aria-pressed="false"><span data-icon="guide"></span><span class="kbd">G</span></button>
    <button class="icon-btn tool" data-tool="limit" aria-label="Polígono limite de cálculo (B)" title="Limite de cálculo da tabela de áreas (B)" aria-pressed="false"><span data-icon="limit"></span><span class="kbd">B</span></button>
    <span class="hsep" aria-hidden="true"></span>

/* ---------- teclado ---------- */
const KEYS = { v: 'select', h: 'pan', r: 'rect', p: 'poly', l: 'line', s: 'curve', a: 'arc', c: 'circle', q: 'measure', d: 'dim', g: 'guide', b: 'limit', m: 'move', k: 'copy', t: 'rotate', x: 'mirror', e: 'stretch', o: 'offset', w: 'trim', f: 'fillet', j: 'chamfer' };
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(); const inForm = ['input', 'select', 'textarea'].includes(tag) || e.target.isContentEditable;
  if (e.key === 'Shift') { S.shift = true; }
  if (inForm) return;
  const ctrl = e.ctrlKey || e.metaKey; const k = e.key.toLowerCase();
  if (ctrl && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && k === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl && k === 'a') { e.preventDefault(); S.sel = new Set(els().filter(x => x.t !== 'guide').map(x => x.id)); refreshPanels(); renderOverlay(); return; }
  if (ctrl && k === 'c') { const sel = selEls(); if (sel.length) { const c = selCenter(); S.clip = sel.map(x => transformEl(clone(x), mT(-c[0], -c[1]))); toast(`${sel.length} elemento(s) copiado(s)`); } return; }
  if (ctrl && k === 'v') { e.preventDefault(); if (S.clip) startPlace(S.clip, 'cópia'); return; }
  if (ctrl && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (ctrl) return;
  if (e.key === 'Escape') { if (S.editBlock && S.tool === 'select' && !S.op && !S.sel.size) { exitBlock(); return; } if (S.tool !== 'select' || S.op) setTool('select'); else { S.sel.clear(); refreshPanels(); renderOverlay(); } return; }
  if (e.key === 'Enter') { if (S.op && S.op.onEnter) { S.op.onEnter(); renderOverlay(); } return; }
  if (e.key === 'Backspace' && S.op && S.op.onBack) { e.preventDefault(); S.op.onBack(); renderOverlay(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); return; }
  if (e.key === ' ') { S.space = true; e.preventDefault(); return; }
  if (e.key === 'F8') { e.preventDefault(); toggle('ortho'); return; }
  if (e.key === 'F7') { e.preventDefault(); toggle('grid'); return; }
  if (e.key === 'F3') { e.preventDefault(); toggle('snap'); return; }
  if (e.key === 'Home') { e.preventDefault(); fitView(); return; }
  if (e.key === '+' || e.key === '=') { zoomAt(1.25, [S.W / 2, S.H / 2]); return; }
  if (e.key === '-' && !(S.op && S.op.typed)) { zoomAt(0.8, [S.W / 2, S.H / 2]); return; }
  if (S.op && S.op.onKey && S.op.onKey(k)) { renderOverlay(); return; }
  if (S.op && S.op.typed && /^[0-9.,\-]$/.test(e.key)) { e.preventDefault(); typedLabel(S.op.label); typed.focus(); typed.value = e.key; return; }
  if (KEYS[k] && !e.altKey) { setTool(KEYS[k]); return; }
});
window.addEventListener('keyup', e => { if (e.key === 'Shift') S.shift = false; if (e.key === ' ') S.space = false; });

function furnBlock(key) {
  const id = 'lib-' + key; if (S.doc.blocks[id]) return id; const f = FURN.find(x => x[0] === key); if (!f) return null;
  S.doc.blocks[id] = { id, name: f[1], kind: 'mobiliario', els: f[2](), rev: 1 }; return id;
}
function thumbSVG(list, w = 72, h = 56) {
  const prims = expandList(list); const P = []; prims.forEach(p => { if (p.t === 'circle') P.push([p.c[0] - p.r, p.c[1] - p.r], [p.c[0] + p.r, p.c[1] + p.r]); else if (p.pts) P.push(...flat(p)); });
  if (!P.length) return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"></svg>`;
  const B = bboxPts(P); const s = Math.min((w - 8) / Math.max(B[2] - B[0], 0.01), (h - 8) / Math.max(B[3] - B[1], 0.01)); const ox = (w - (B[2] - B[0]) * s) / 2 - B[0] * s, oy = (h + (B[3] - B[1]) * s) / 2 + B[1] * s;
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><g transform="matrix(${s} 0 0 ${-s} ${ox} ${oy})">${prims.map(p => elMarkup(p)).join('')}</g></svg>`;
}

  const map = {};

  mutate(() => {
    Object.entries(entry.blocks).forEach(([oldId, def]) => { const nid = map[oldId]; if (S.doc.blocks[nid]) return; const d = clone(def); d.id = nid; d.libRef = entry.id + ':' + oldId; d.els.forEach(e => { if (e.t === 'block' && map[e.bid]) e.bid = map[e.bid]; }); if (oldId === entry.root) d.name = entry.name; S.doc.blocks[nid] = d; });
  }, { keepPanel: true });
  placeBlock(map[entry.root], false);
}

/* ---------- tabela de áreas ---------- */
function computeAreas() {
  const sh = sheet(); const top = sh.els;
  const limits = top.filter(e => e.t === 'poly' && e.role === 'limit');
  const groups = limits.length ? limits.map(l => ({ name: l.name || 'Limite', R: flat(l), id: l.id })) : [{ name: sh.name + ' (folha inteira)', R: null }];
  const prims = expandList(top);
  const units = prims.filter(p => p.closed && p.role === 'unit' && p.pts);
  const unitR = units.map(u => flat(u));
  // instâncias de bloco (todas as profundidades) com centro em coordenadas da folha
  const inst = []; const walk = (list, M) => list.forEach(e => { if (e.t !== 'block') return; const def = S.doc.blocks[e.bid]; if (!def) return; const M2 = mMul(M, e.m); const B = unionBBox(def.els); const c = B ? mApply(M2, [(B[0] + B[2]) / 2, (B[1] + B[3]) / 2]) : mApply(M2, [0, 0]); if (def.kind !== 'mobiliario') inst.push({ bid: e.bid, c }); walk(def.els, M2); });
  walk(top, MI);
  return groups.map(g => {
    const inG = p => !g.R || pip(p, g.R);
    const byUse = {}; const rooms = [];
    prims.forEach(p => {
      if (!(p.closed || p.t === 'circle') || !(p.role === 'room' || p.role === 'unit')) return;
      const R = flat(p); const c = labelPoint(R); if (!inG(c)) return;
      const A = areaOf(p);
      if (p.role === 'room') { const insideUnit = unitR.some((U, i) => units[i] !== p && pip(c, U)); rooms.push({ name: p.name, usage: p.usage, A, inUnit: insideUnit }); if (insideUnit) return; }
      const k = p.usage || '(sem categoria)'; byUse[k] = byUse[k] || { A: 0, n: 0 }; byUse[k].A += A; byUse[k].n++;
    });
    const typ = {}; inst.forEach(i => { if (!inG(i.c)) return; typ[i.bid] = (typ[i.bid] || 0) + 1; });
    const inUse = {}; rooms.filter(r => r.inUnit).forEach(r => { const k = r.usage || '(sem categoria)'; inUse[k] = inUse[k] || { A: 0, n: 0 }; inUse[k].A += r.A; inUse[k].n++; });
    return { name: g.name, byUse, inUse, typ, rooms, total: Object.values(byUse).reduce((a, b) => a + b.A, 0) };
  });
}
function renderAreas() {
  const P = $('#p-areas'); if (S.editBlock) { P.innerHTML = '<p class="note">Conclua a edição do bloco para ver a tabela da folha.</p>'; return; }
  const res = computeAreas(); let h = `<p class="note">Folha “${esc(sheet().name)}”. ${sheet().els.some(e => e.role === 'limit') ? 'Somente o que está dentro de cada polígono limite é contado.' : 'Sem polígono limite: contando a folha inteira. Use a ferramenta Limite (B) para recortar o que entra na conta.'} Ambientes dentro de uma área de unidade entram só no detalhamento.</p>`;
  h += `<div class="btn-row" style="margin-bottom:12px"><button class="btn" id="ar-limit">${icon('limit')}Desenhar limite</button><button class="btn" id="ar-copy">${icon('copy')}Copiar</button><button class="btn" id="ar-csv">${icon('download')}CSV</button></div>`;
  res.forEach(g => {
    const rows = Object.entries(g.byUse).sort((a, b) => b[1].A - a[1].A);
    h += `<table class="at"><caption>${esc(g.name)}</caption><thead><tr><th>Categoria de uso</th><th class="n">Qtd</th><th class="n">Área m²</th></tr></thead><tbody>${rows.map(([k, v]) => `<tr><td><span class="sw" style="background:${usageColor(k) || '#eee'}"></span>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${fmt(v.A)}</td></tr>`).join('') || '<tr><td colspan="3">Nenhuma mancha</td></tr>'}<tr class="tot"><td>Total</td><td></td><td class="n">${fmt(g.total)}</td></tr></tbody></table>`;
    const ir = Object.entries(g.inUse).sort((a, b) => b[1].A - a[1].A);
    if (ir.length) h += `<table class="at"><thead><tr><th>Ambientes nas unidades</th><th class="n">Qtd</th><th class="n">Área m²</th></tr></thead><tbody>${ir.map(([k, v]) => `<tr><td><span class="sw" style="background:${usageColor(k) || '#eee'}"></span>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${fmt(v.A)}</td></tr>`).join('')}<tr class="tot"><td>Soma dos ambientes</td><td></td><td class="n">${fmt(ir.reduce((a, [, v]) => a + v.A, 0))}</td></tr></tbody></table>`;
    const tr = Object.entries(g.typ);
    if (tr.length) {
      h += `<table class="at"><thead><tr><th>Tipologia</th><th class="n">Qtd</th><th class="n">Un. m²</th><th class="n">Total m²</th></tr></thead><tbody>${tr.map(([bid, n]) => { const d = S.doc.blocks[bid]; const a = blockArea(bid); return `<tr><td>${esc(d?.name)}<br><small class="tag">${d?.kind}</small></td><td class="n">${n}</td><td class="n">${fmt(a)}</td><td class="n">${fmt(a * n)}</td></tr>`; }).join('')}</tbody></table>`;
      tr.forEach(([bid]) => { const d = S.doc.blocks[bid]; if (!d || d.kind !== 'unidade') return; const ps = expandList(d.els).filter(p => p.closed && p.role === 'room'); if (!ps.length) return; h += `<details class="typ"><summary>Ambientes — ${esc(d.name)}</summary><div><table class="at"><thead><tr><th>Ambiente</th><th>Categoria</th><th class="n">m²</th></tr></thead><tbody>${ps.map(p => `<tr><td>${esc(p.name || '—')}</td><td>${esc(p.usage || '')}</td><td class="n">${fmt(areaOf(p))}</td></tr>`).join('')}<tr class="tot"><td>Soma dos ambientes</td><td></td><td class="n">${fmt(ps.reduce((a, p) => a + areaOf(p), 0))}</td></tr></tbody></table></div></details>`; });
    }
  });

/* conversão local (m) <-> lng/lat — equiretangular local em torno da origem da folha */

    feats = feats.filter(f => f && f.geometry);
    if (!feats.length) return toast('Selecione elementos no mapa do Giraffe antes de importar');
    const sh = sheet();
    if (!sh.geo) { const all = []; feats.forEach(f => { const g = f.geometry; const c = g.type === 'Polygon' ? g.coordinates[0] : g.type === 'MultiPolygon' ? g.coordinates[0][0] : g.type === 'LineString' ? g.coordinates : g.type === 'Point' ? [g.coordinates] : []; all.push(...c); }); const b = bboxPts(all); sh.geo = { lng: (b[0] + b[2]) / 2, lat: (b[1] + b[3]) / 2, rot: 0 }; }
